name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full regression across all browsers at 07:00 UTC.
    - cron: "0 7 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The repo's default GITHUB_TOKEN permission is `read` (contents-only). The
# wait-for-vercel-preview action polls /repos/:owner/:repo/deployments which
# requires `deployments: read`. Without this block every poll 401s and the job
# times out after 10 minutes.
permissions:
  contents: read
  deployments: read
  pull-requests: read
  statuses: read

jobs:
  wait-for-preview:
    name: Wait for Vercel preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    outputs:
      preview_url: ${{ steps.wait.outputs.url }}
    steps:
      - name: Wait for Vercel preview deployment
        id: wait
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

  provision-neon:
    name: Provision Neon branch
    runs-on: ubuntu-latest
    needs: wait-for-preview
    if: github.event_name == 'pull_request'
    outputs:
      db_url: ${{ steps.branch.outputs.db_url }}
      branch_id: ${{ steps.branch.outputs.branch_id }}
    steps:
      - name: Create Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

  e2e:
    name: Playwright shard ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    needs: [wait-for-preview, provision-neon]
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
        total: [4]
    env:
      E2E_BASE_URL: ${{ needs.wait-for-preview.outputs.preview_url }}
      DATABASE_URL: ${{ needs.provision-neon.outputs.db_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright
        run: pnpm exec playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  teardown-neon:
    name: Teardown Neon branch
    runs-on: ubuntu-latest
    needs: [provision-neon, e2e]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

  nightly-full:
    name: Nightly regression (all browsers)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      E2E_BASE_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report-${{ matrix.browser }}
          path: playwright-report/
