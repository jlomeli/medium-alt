allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  # Optional native binding for msgpackr (a transitive dep of uploadthing).
  # Without it msgpackr falls back to pure JS; with it, encode/decode is faster.
  # Safe to allow — the postinstall just compiles the native module.
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
